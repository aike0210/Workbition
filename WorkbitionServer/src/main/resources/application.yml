server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: WorkbitionServer

  # ==================== 数据库配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/workbition?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # ==================== Flyway 数据库迁移 ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # ==================== 邮件配置 ====================
  mail:
    host: smtp.qq.com
    port: 465
    username: your-email@qq.com
    password: your-email-password
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  # ==================== Jackson 配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aike.workbitionserver.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== JWT 配置 ====================
jwt:
  secret: WorkbitionSecretKey2026MustBeLongEnoughForHS256Algorithm
  access-token-expiration: 7200000      # 2小时 (毫秒)
  refresh-token-expiration: 604800000   # 7天 (毫秒)
  header: Authorization
  prefix: "Bearer "

# ==================== MinIO 配置 ====================
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: workbition

# ==================== Knife4j 配置（暂不兼容 Spring Boot 4.x，等官方适配后启用） ====================
