# ==================== Actuator 配置 ====================
management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.aike.workbitionserver: DEBUG
    com.aike.workbitionserver.mapper: DEBUG
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
