# Configuration for auto-assign - https://github.com/marketplace/actions/auto-assign-issues

# Set to true to add reviewers to pull requests
addReviewers: true

# Set to true to add assignees to issues
addAssignees: true

# A list of reviewers to be added to pull requests (GitHub user names)
reviewers:
  - workbition-team

# A list of assignees to be added to issues (GitHub user names)
assignees:
  - workbition-team

# A list of keywords to skip auto-assigning
skipKeywords:
  - wip
  - draft
  - do not merge

# Number of reviewers to add
numberOfReviewers: 2

# A list of labels to skip auto-assigning
labelsToSkip:
  - wip
  - draft