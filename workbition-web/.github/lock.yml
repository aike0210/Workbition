# Configuration for lock-threads - https://github.com/marketplace/actions/lock-threads

# Number of days of inactivity before a closed issue or pull request is locked
daysUntilLock: 365

# Skip issues and pull requests created before a given timestamp
skipCreatedBefore: false

# Issues and pull requests with these labels will be exempt from locking
exemptLabels:
  - pinned
  - security

# Label to add to locked issues and pull requests
lockLabel: '🔒 Locked'

# Comment to post before locking. Set to `false` to disable
lockComment: >
  This thread has been automatically locked since there has not been
  any recent activity after it was closed. Please open a new issue
  for related bugs or questions.

# Only lock issues (not pull requests)
# issuesOnly: true

# Only lock pull requests (not issues)
# prOnly: true

# Lock both issues and pull requests
# Both issues and pull requests will be locked